<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Very Important Question ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #ffe6f0;

            font-family: Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main container */

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Question */

        #question {
            color: #d6336c;

            font-size: 30px;
            font-weight: bold;

            margin: 0;

            position: absolute;

            top: 120px;
            left: 50%;

            transform: translateX(-50%);

            white-space: nowrap;
        }

        /* Message after YES */

        #message {
            color: #d6336c;

            font-size: 22px;
            font-weight: bold;

            position: absolute;

            top: 210px;
            left: 50%;

            transform: translateX(-50%);

            white-space: nowrap;
        }

        /* Buttons */

        button {
            border: none;

            font-family: Helvetica, Arial, sans-serif;

            font-size: 16px;
            font-weight: bold;

            padding: 10px 20px;

            border-radius: 8px;

            cursor: pointer;

            transition: transform 0.15s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* YES button */

        #yesButton {
            position: absolute;

            left: 50%;

            top: 280px;

            transform: translateX(-60px);

            background: #ff4d6d;

            color: white;
        }

        #yesButton:hover {
            transform: translateX(-60px) scale(1.08);
        }

        /* NO button */

        #noButton {
            position: absolute;

            left: calc(50% + 40px);

            top: 280px;

            background: #999999;

            color: white;
        }

        /* Floating hearts */

        .heart {
            position: absolute;

            font-size: 25px;

            pointer-events: none;

            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-500px);
                opacity: 0;
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            #question {
                font-size: 26px;
            }

            #message {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- Question -->

        <h1 id="question">
            Do you love me? ❤️
        </h1>


        <!-- Message -->

        <div id="message"></div>


        <!-- YES -->

        <button id="yesButton" onclick="yesClicked()">
            YES ❤️
        </button>


        <!-- NO -->

        <button id="noButton">
            NO 💔
        </button>

    </div>


    <script>

        /* =========================
           YES BUTTON
        ========================= */

        function yesClicked() {

            document.getElementById("question").innerHTML =
                "I KNEW IT!!! ❤️🥰";


            document.getElementById("message").innerHTML =
                "Love youuuuu daviii ummaaaaa! 💕";


            // Hide NO button

            document.getElementById("noButton").style.display =
                "none";


            // Create hearts

            createHearts();

        }



        /* =========================
           NO BUTTON
        ========================= */

        const noButton =
            document.getElementById("noButton");


        function moveNo() {

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            // Keep button inside screen

            const maxX =
                window.innerWidth - buttonWidth - 10;

            const maxY =
                window.innerHeight - buttonHeight - 10;


            const x =
                Math.random() * maxX;


            const y =
                Math.random() * maxY;


            noButton.style.left =
                x + "px";


            noButton.style.top =
                y + "px";


            // Change the text randomly

            const messages = [

                "NO 💔",

                "Are you sure? 🥺",

                "Really?? 😭",

                "Think again! 👀",

                "Nice try 😂",

                "Nopeee 😌",

                "Try again! 😭",

                "JUST SAY YES ❤️"

            ];


            noButton.innerHTML =
                messages[
                    Math.floor(
                        Math.random() * messages.length
                    )
                ];

        }



        /* Mouse */

        noButton.addEventListener(
            "mouseenter",
            moveNo
        );


        /* Phone */

        noButton.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                moveNo();

            }
        );



        /* =========================
           FLOATING HEARTS
        ========================= */

        function createHearts() {

            for (let i = 0; i < 40; i++) {

                const heart =
                    document.createElement("div");


                heart.className =
                    "heart";


                heart.innerHTML =
                    "❤️";


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.top =
                    (50 + Math.random() * 50) + "vh";


                heart.style.fontSize =
                    (18 + Math.random() * 30) + "px";


                heart.style.animationDuration =
                    (2 + Math.random() * 3) + "s";


                document.body.appendChild(
                    heart
                );


                // Remove after animation

                setTimeout(function() {

                    heart.remove();

                }, 5000);

            }

        }

    </script>

</body>

</html>
